name: Record verified CI baseline

on:
  push:
    branches: [main]
    paths: [".github/workflows/record-baseline.yml"]

permissions: {}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out baseline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record the successful baseline and remove this one-time helper
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import datetime
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.request
          
          repo = os.environ["GITHUB_REPOSITORY"]
          source = os.environ["GITHUB_SHA"]
          api = os.environ["GITHUB_API_URL"]
          token = os.environ["GH_TOKEN"]
          
          def get(path):
              request = urllib.request.Request(
                  api + "/repos/" + repo + path,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
          deadline = time.monotonic() + 360
          while True:
              runs = get("/actions/workflows/tests.yml/runs?head_sha=" + source + "&event=push")["workflow_runs"]
              matching = [run for run in runs if run["head_sha"] == source and run["head_branch"] == "main"]
              if matching:
                  run = max(matching, key=lambda item: item["id"])
                  if run["status"] == "completed":
                      if run["conclusion"] != "success":
                          raise RuntimeError("Tests must pass before recording a baseline")
                      break
              if time.monotonic() >= deadline:
                  raise TimeoutError("Tests did not finish within the baseline recording deadline")
              time.sleep(5)
          
          jobs = get("/actions/runs/" + str(run["id"]) + "/jobs?per_page=100")["jobs"]
          expected = {"Python 3.12 on ubuntu-latest", "Python 3.12 on windows-latest"}
          assert {job["name"] for job in jobs} == expected, "Both CI platforms must be present"
          assert all(job["conclusion"] == "success" for job in jobs), "Both platforms must pass"
          
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          lines = [
              "# Verified CI baseline",
              "",
              "Recorded at " + now + ".",
              "",
              "- Source revision: " + source + ".",
              "- Test run: " + run["html_url"] + ".",
              "- Python: 3.12 on Windows and Linux.",
              "- Regression suite, Python syntax, dashboard JavaScript syntax and offline verification CLI: passed.",
              "- Real-model verification remains pending; CI uses simulated provider responses and no model API key.",
              "",
              "This records the observed CI result. It does not establish scanner coverage or model assessment quality.",
              "",
          ]
          Path("docs/CI_BASELINE.md").write_text("\n".join(lines), encoding="utf-8")
          # Remove this one-time recording helper; the normal Tests workflow stays read-only.
          Path(".github/workflows/record-baseline.yml").unlink()
          actor = os.environ["GITHUB_ACTOR"]
          actor_id = os.environ["GITHUB_ACTOR_ID"]
          subprocess.run(["git", "config", "user.name", actor], check=True)
          subprocess.run(["git", "config", "user.email", actor_id + "+" + actor + "@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "--", "docs/CI_BASELINE.md", ".github/workflows/record-baseline.yml"], check=True)
          # This is the current instant in UTC, not an earlier date.
          dates = dict(os.environ, GIT_AUTHOR_DATE=now, GIT_COMMITTER_DATE=now)
          subprocess.run(["git", "commit", "-m", "docs: record verified cross-platform CI baseline"], env=dates, check=True)
          subprocess.run(["git", "log", "-1", "--format=%H%n%aI%n%cI"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          
