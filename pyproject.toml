[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "security-assessment-platform"
version = "0.1.0"
description = "Local security assessment lab with policy-gated tool execution"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.2", "pydantic==2.12.5", "httpx==0.28.1", "uvicorn==0.42.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
